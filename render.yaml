services:
  - type: web
    name: examguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    disk:
      name: examguard-data
      mountPath: /opt/render/project/src/backend/instance
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/instance/examguard.db
      - key: CORS_ORIGINS
        value: https://examguard.onrender.com

  - type: static_site
    name: examguard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://examguard-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
